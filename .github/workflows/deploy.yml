name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CI: typecheck + build on every PR and push ────────────────────────────
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install (backend)
        run: bun install --frozen-lockfile

      - name: Install (web)
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck (backend)
        run: bun run typecheck

      - name: Build (web, includes tsc)
        working-directory: web
        run: bun run build

  # ── CD: migrate DB then deploy to Vercel production ────────────────────────
  # Runs only on pushes to master (and manual dispatch) — PRs are check-only.
  migrate:
    name: Migrate database
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install (backend)
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # config.ts validates required vars at boot; migrations never touch
          # admin routes, so a placeholder satisfies validation in CI. The
          # real key is only ever set in the Vercel dashboard.
          ADMIN_API_KEY: ci-not-used

  deploy:
    name: Deploy to Vercel
    if: github.event_name != 'pull_request'
    needs: [check, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vercel build runs the install command from the lockfile (bun.lock),
      # so the runner needs bun — not just node for the Vercel CLI.
      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
