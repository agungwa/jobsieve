services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobsfound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobsfound
    ports:
      - "5432:5432"
    volumes:
      - jobsfound-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobsfound"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobsfound-pg:
